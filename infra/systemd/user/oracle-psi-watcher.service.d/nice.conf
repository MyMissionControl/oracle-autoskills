# หน่วงตัว index ให้ใช้เฉพาะ CPU ที่เหลือ — ไม่ให้แย่งกับ build ของ orches
# ⛔ ไม่ใช่ "ปิด": ปิดแล้ว memory ที่เขียนระหว่างนั้นจะหลุด index ถาวร
#    (reconcile ตอนสตาร์ต "trust the existing index, set baseline, don't reindex")
# นโยบายเดียวกับที่เครื่องนี้ตั้งให้ ollama อยู่แล้ว (Nice=15 CPUWeight=10)
# ย้อนกลับ: rm ไฟล์นี้ แล้ว systemctl --user daemon-reload && restart
[Service]
Nice=15
CPUWeight=10
IOSchedulingClass=idle
